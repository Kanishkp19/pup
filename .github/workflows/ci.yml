name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r tools/requirements.txt

      - name: Run Spec Generator Check
        run: python tools/gen_from_spec.py

      - name: Validate Placeholder Assets
        run: python tools/validate_assets.py --tier placeholder

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Test Frontend
        run: npm run test

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
